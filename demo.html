<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo | Back of Mind</title>
<meta name="description" content="Try Back of Mind in your browser. Notes you write here stay in this browser.">
<link rel="icon" href="favicon.png">
</head>
<body>
<style>
@font-face { font-family: "Hanken Grotesk"; src: url(hanken-grotesk.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; src: url(atkinson-hyperlegible-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
body { margin: 0; font-size: 14px; } [hidden] { display: none !important; }
/* Layout: one paper sheet; everything hangs off a single round button at bottom center. */
:root {
  color-scheme: light;
  --paper: #fdfaf0;
  --ink: #141414;
  --ink-soft: #6b675c;
  --ink-faint: #b9b3a3;
  --line: #e9e3d2;
  --sheet: #fffdf7;
  --shadow: 0 10px 34px rgba(60, 50, 20, .16), 0 1px 3px rgba(60, 50, 20, .1);
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --on-tint: #141414;
}
:root[data-inv] {
  color-scheme: dark;
  --paper: #141413; --ink: #f6f2e6; --ink-soft: #a39e90; --ink-faint: #5e5a50; --line: #48453e; --sheet: #302f2b;
  --shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.screen { position: fixed; inset: 0; transition: opacity .22s ease; }
.screen.off { opacity: 0; pointer-events: none; }

/* Start */
#start { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px; padding-bottom: 24vh; background: var(--paper); z-index: 5; }
#logo { width: min(320px, 76%); height: auto; margin-block: auto; mix-blend-mode: multiply; user-select: none; -webkit-user-drag: none; }
:root[data-inv] #logo { filter: invert(1); mix-blend-mode: screen; }
.inv { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink-faint); background: linear-gradient(90deg, #ffffff 50%, #111111 50%); }
#thanksBtn { position: absolute; right: 16px; bottom: calc(50px + env(safe-area-inset-bottom, 0px)); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ink-faint); font-size: 12px; color: var(--ink-soft); }
#web { z-index: 6; background: var(--paper); overflow-y: auto; padding-inline: 24px; padding-block: 72px 48px; }
#web .col { max-width: 420px; margin-inline: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
#webLogo { width: min(220px, 60%); mix-blend-mode: multiply; }
:root[data-inv] #webLogo { filter: invert(1); mix-blend-mode: screen; }
#web h1 { margin: 0; font-size: 28px; font-weight: 700; text-wrap: balance; }
#web p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-soft); }
#web ul { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
#web li { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
#web .cta { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 14px 32px; font-size: 16px; font-weight: 500; margin-top: 10px; }
#web .fine { font-size: 12px; color: var(--ink-soft); opacity: .7; }
#webBack { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); border: 1px solid var(--line); color: var(--ink-soft); display: grid; place-items: center; }
#exitBtn { position: fixed; left: 16px; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); border: 1px solid var(--line); color: var(--ink-soft); display: grid; place-items: center; z-index: 4; }
#gear { position: fixed; left: calc(50% + 42px); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); border: 1px solid var(--line); color: var(--ink-soft); display: grid; place-items: center; z-index: 4; }
#menu { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(440px, calc(100% - 32px)); box-sizing: border-box; background: var(--sheet); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); padding: 12px; z-index: 3; display: flex; flex-direction: column; }
#menu .item { text-align: left; padding: 18px 22px; font-size: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
#menu .mhead { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 22px 6px; }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 22px; }
#undoHint { font-size: 13px; color: var(--ink-soft); min-width: 0; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu .item:active { background: var(--line); }
#menu .item:disabled { opacity: .35; cursor: default; }
#mInv { align-self: center; width: 46px; height: 46px; margin: 12px 0 8px; }
#openBtn { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 20px 68px; font-size: 20px; font-weight: 500; letter-spacing: .02em; transition: transform .16s cubic-bezier(.3, 1.6, .5, 1); }
#openBtn:active { transform: scale(.9); }
#openBtn.go { animation: openPop .34s ease-out; }
@keyframes openPop {
  0% { transform: scale(.9); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ink) 40%, transparent); }
  55% { transform: scale(1.1); }
  100% { transform: scale(1); box-shadow: 0 0 0 28px transparent; }
}
@media (prefers-reduced-motion: reduce) { #openBtn.go { animation: none; } }
#invBtn { position: absolute; left: 50%; margin-left: -17px; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.mark { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 11px; letter-spacing: .08em; color: var(--ink-faint); }

/* Main */
#main { overflow-y: auto; padding-inline: 16px; padding-block: 20px 140px; }
#grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 720px; margin-inline: auto; align-items: start; }
.note { text-align: left; border-radius: 12px; padding: 10px; background: var(--c, var(--sheet)); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; gap: 4px; position: relative; transition: transform .18s ease, box-shadow .18s ease; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; }
.note:nth-child(3n+1) { transform-origin: 0 50%; }
.note:nth-child(3n) { transform-origin: 100% 50%; }
.note.held { transform: scale(1.6); z-index: 1; box-shadow: var(--shadow); }
.note h3 { margin: 0; font-family: "Atkinson Hyperlegible", var(--font); font-size: 14.5px; font-weight: 700; line-height: 1.25; letter-spacing: .01em; overflow-wrap: anywhere; padding-bottom: 5px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
.note h3 .st { margin-right: 4px; font-size: .92em; }
.note h3:only-child { padding-bottom: 0; border-bottom: 0; }
.note { color: var(--on-tint); }
.note.plain { color: var(--ink); }
#pop { color: var(--pi); --pi: var(--on-tint); --pb: #fffdf7; }
#pop.plain { --pi: var(--ink); --pb: var(--paper); }
.note p { margin: 0; font-size: 11.5px; line-height: 1.4; opacity: .82; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-faint); font-size: 13px; pointer-events: none; }

#plus { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; box-shadow: var(--shadow); z-index: 4; transition: transform .2s ease; }
#plus svg { transition: transform .2s ease; }
#plus.open svg { transform: rotate(45deg); }
#plus:active { transform: scale(.94); }

/* Popup */
#veil { position: fixed; inset: 0; z-index: 2; }
#pop { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: min(320px, calc(100% - 32px)); transform: translateX(-50%) translateY(10px) scale(.96); transform-origin: 50% 100%; opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease, background .15s ease; background: var(--c, var(--sheet)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
#pop.open { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
#pop.center { bottom: auto; top: 50%; transform: translate(-50%, -48%) scale(.96); transform-origin: 50% 50%; }
#pop.center.open { transform: translate(-50%, -50%); }
#pop.center #noteBody { height: min(240px, 40vh); }
#noteTitle, #noteBody { width: 100%; box-sizing: border-box; border: 0; background: transparent; font-family: var(--font); color: inherit; resize: none; padding: 4px 2px; }
#noteTitle { font-family: "Atkinson Hyperlegible", var(--font); font-size: 19px; font-weight: 700; padding-right: 84px; margin-top: 14px; padding-bottom: 9px; border-bottom: 1px solid color-mix(in srgb, currentColor 16%, transparent); }
#noteBody { font-size: 14px; line-height: 1.45; height: 130px; }
#noteTitle::placeholder, #noteBody::placeholder { color: color-mix(in srgb, currentColor 35%, transparent); }
#noteTitle:focus-visible, #noteBody:focus-visible { outline: none; }
.actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid rgba(0,0,0,.07); padding-top: 10px; }
#saveBtn { background: var(--pi); color: var(--pb); border-radius: 999px; padding: 9px 26px; font-size: 14px; font-weight: 500; }
#delBtn { font-size: 12px; opacity: .65; padding: 6px 8px; border-radius: 999px; }

.note, #pop { --sheen: rgba(255, 255, 255, .95); }
.note.plain, #pop.plain { --sheen: rgba(222, 176, 58, .6); }
:root[data-inv] .note.plain, :root[data-inv] #pop.plain { --sheen: rgba(255, 255, 255, .34); }
.note { --edge: 16px; }
#pop { --edge: 30px; }
.starred { isolation: isolate; }
.starred::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, #000, transparent var(--edge)), linear-gradient(to left, #000, transparent var(--edge)), linear-gradient(to bottom, #000, transparent var(--edge)), linear-gradient(to top, #000, transparent var(--edge));
  mask-image: linear-gradient(to right, #000, transparent var(--edge)), linear-gradient(to left, #000, transparent var(--edge)), linear-gradient(to bottom, #000, transparent var(--edge)), linear-gradient(to top, #000, transparent var(--edge));
  background-image:
    radial-gradient(circle, var(--sheen) 0 1.4px, transparent 2.6px),
    radial-gradient(circle, var(--sheen) 0 .9px, transparent 2px),
    radial-gradient(circle, var(--sheen) 0 2.2px, transparent 3.8px);
  background-size: 23px 29px, 17px 19px, 37px 31px;
  background-position: 0 0, 6px 10px, 15px 4px;
  animation: drift 12s linear infinite;
}
@keyframes drift { to { background-position: 23px -58px, -28px -28px, 52px -58px; } }
@media (prefers-reduced-motion: reduce) { .starred::before { animation: none; } }
#starBtn { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
#starBtn[aria-pressed="true"] svg { fill: currentColor; }
#colorBtn { position: absolute; top: 10px; right: 50px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); background: conic-gradient(#f6d9d2, #fbe9a8, #d6ecd0, #d3e4f5, #e3d9f2, #f6d9d2); }
#colors { position: absolute; top: 48px; right: 8px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px; max-width: calc(100% - 16px); box-sizing: border-box; background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); z-index: 1; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(0,0,0,.14); background: var(--c); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 3.5px var(--ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<section id="start" class="screen">
  <img id="logo" alt="BOM" src="logo.webp">
  <button id="openBtn" type="button">Open</button>
  <button id="invBtn" class="inv" type="button" aria-label="Invert colors"></button>
  <button id="thanksBtn" type="button">Back to website</button>
  <div class="mark">Back of Mind</div>
</section>


<main id="main" class="screen off">
  <div id="grid"></div>
  <div id="empty" hidden>Nothing here yet. Tap + to add a note.</div>
</main>

<div id="veil" hidden></div>
<div id="pop" role="dialog" aria-label="Note">
  <button id="colorBtn" type="button" aria-label="Note color"></button>
  <button id="starBtn" type="button" aria-label="Star" aria-pressed="false">
    <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2-4.6-2.5-4.6 2.5.9-5.2L2.5 8l5.2-.7z"/></svg>
  </button>
  <div id="colors" hidden></div>
  <input id="noteTitle" type="text" placeholder="Title" maxlength="80" autocomplete="off">
  <textarea id="noteBody" placeholder="Note"></textarea>
  <div class="actions">
    <button id="delBtn" type="button">Delete</button>
    <button id="saveBtn" type="button">Save</button>
  </div>
</div>
<div id="menu" hidden>
  <div class="mhead">Settings</div>
  <button id="mEx" class="item" type="button">Add example notes</button>
  <button id="mClear" class="item" type="button">Clear all notes</button>
  <hr>
  <button id="mUndo" class="item" type="button">Undo delete<span id="undoHint"></span></button>
  <hr>
  <button id="mInv" class="inv" type="button" aria-label="Invert colors"></button>
</div>
<button id="exitBtn" type="button" aria-label="Back to start screen" hidden>
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
</button>
<button id="gear" type="button" aria-label="Settings" hidden>
  <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 14h14"/><circle cx="8" cy="6" r="2.2" fill="var(--sheet)"/><circle cx="12" cy="14" r="2.2" fill="var(--sheet)"/></svg>
</button>
<button id="plus" type="button" aria-label="New note" hidden>
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 3v16M3 11h16"/></svg>
</button>

<script>
const $ = id => document.getElementById(id);
const KEY = 'back-of-mind-notes';
const COLORS = ['#fffdf7', '#fbe9a8', '#f8dcc4', '#f6d9d2', '#d6ecd0', '#d3e4f5', '#e3d9f2'];
let notes = [];
try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
let editing = null, color = COLORS[0];

function store() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {} }
let undo = null;
try { undo = JSON.parse(localStorage.getItem(KEY + '-undo')) || null; } catch (e) {}
function saveUndo() { try { localStorage.setItem(KEY + '-undo', JSON.stringify(undo)); } catch (e) {} }
function removeNotes(list) {
  const gone = list.map(n => [notes.indexOf(n), n]).filter(u => u[0] >= 0).sort((a, b) => a[0] - b[0]);
  if (!gone.length) return;
  undo = gone;
  notes = notes.filter(n => !list.includes(n));
  saveUndo(); store(); render();
}
function undoDelete() {
  if (!undo) return;
  for (const [i, n] of undo) notes.splice(Math.min(i, notes.length), 0, n);
  undo = null; saveUndo(); store(); render();
}

function render() {
  const grid = $('grid');
  grid.textContent = '';
  for (const n of notes.filter(n => n.star).concat(notes.filter(n => !n.star))) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = n.star ? 'note starred' : 'note';
    if (n.color === COLORS[0]) b.classList.add('plain'); else b.style.setProperty('--c', n.color);
    if (n.title || n.star) {
      const h = document.createElement('h3'); h.textContent = n.title;
      if (n.star) { const s = document.createElement('span'); s.className = 'st'; s.textContent = '★'; h.prepend(s); }
      b.append(h);
    }
    if (n.body) { const p = document.createElement('p'); p.textContent = n.body; b.append(p); }
    let timer, wasHeld = false, swiping = false, down = false, sx = 0, sy = 0, dx = 0;
    const release = () => { down = false; clearTimeout(timer); b.classList.remove('held'); b.style.transition = b.style.transform = b.style.opacity = ''; };
    b.onpointerdown = e => {
      wasHeld = swiping = false; down = true; sx = e.clientX; sy = e.clientY; dx = 0;
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      timer = setTimeout(() => { wasHeld = true; b.classList.add('held'); }, 300);
    };
    b.onpointermove = e => {
      if (!down || wasHeld) return;
      dx = e.clientX - sx;
      if (!swiping && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - sy)) { swiping = true; clearTimeout(timer); b.style.transition = 'none'; }
      if (swiping) { const x = Math.min(0, dx); b.style.transform = 'translateX(' + x + 'px)'; b.style.opacity = Math.max(.25, 1 + x / 160); }
    };
    b.onpointerup = () => {
      if (!(swiping && dx < -70)) return release();
      down = false;
      b.style.transition = 'transform .16s ease, opacity .16s ease'; b.style.transform = 'translateX(-130%)'; b.style.opacity = 0;
      setTimeout(() => removeNotes([n]), 160);
    };
    b.onpointercancel = release;
    b.addEventListener('touchmove', e => { if (wasHeld && e.cancelable) e.preventDefault(); }, { passive: false });
    b.oncontextmenu = e => e.preventDefault();
    b.onclick = () => { if (!wasHeld && !swiping) openPop(n); };
    grid.append(b);
  }
  $('empty').hidden = notes.length > 0;
}

function setColor(c) {
  color = c;
  const plain = c === COLORS[0];
  $('pop').classList.toggle('plain', plain);
  if (plain) $('pop').style.removeProperty('--c'); else $('pop').style.setProperty('--c', c);
  document.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', s.dataset.c === c));
}

let star = false;
function setStar(v) {
  star = v; $('pop').classList.toggle('starred', v); $('starBtn').setAttribute('aria-pressed', v);
}
function openPop(n) {
  editing = n || null;
  $('pop').classList.toggle('center', !!n);
  $('noteTitle').value = n ? n.title : '';
  $('noteBody').value = n ? n.body : '';
  setColor(n ? n.color : COLORS[0]);
  setStar(n ? !!n.star : false);
  $('colors').hidden = true;
  $('pop').classList.add('open'); $('plus').classList.add('open'); $('veil').hidden = false;
  if (!n) $('noteTitle').focus();
}
function closePop() {
  $('pop').classList.remove('open'); $('plus').classList.remove('open'); $('veil').hidden = true;
  $('colors').hidden = true; editing = null;
  document.activeElement && document.activeElement.blur();
}
function save() {
  const title = $('noteTitle').value.trim(), body = $('noteBody').value.trim();
  if (title || body) {
    if (editing) Object.assign(editing, { title, body, color, star });
    else notes.unshift({ id: Date.now(), title, body, color, star });
    store(); render();
  }
  closePop();
}
function del() {
  if (editing) removeNotes([editing]);
  closePop();
}

for (const c of COLORS) {
  const s = document.createElement('button');
  s.type = 'button'; s.className = 'sw'; s.dataset.c = c; s.style.setProperty('--c', c === COLORS[0] ? 'var(--sheet)' : c);
  s.setAttribute('aria-label', 'Color'); s.onclick = () => { setColor(c); $('colors').hidden = true; };
  $('colors').append(s);
}

$('openBtn').onclick = () => {
  $('openBtn').classList.add('go');
  setTimeout(() => {
    $('start').classList.add('off'); $('main').classList.remove('off'); $('plus').hidden = false; $('gear').hidden = false; $('exitBtn').hidden = false;
  }, 260);
};

const EX = [
  ['Weekend shop', 'Milk\nRye bread\nEggs\nButter\nCoffee\nTomatoes', 1, 1],
  ['Packing for Lapland', 'Wool socks\nHeadlamp\nThermos\nCamera\nCharger', 5, 1],
  ['Call mum', '', 0],
  ['Baking', 'Flour\nSugar\nCardamom\nYeast\nPearl sugar', 3],
  ['App idea', 'A notes app with one button. No folders, no accounts, nothing to set up. You open it, write the thing down, and close it again.', 4],
  ['Dentist', 'Thu 14:30', 1],
  ['Books to read', 'The Summer Book\nPiranesi\nA Month in the Country', 6],
  ['Gift ideas', 'Board game\nGood coffee\nWool blanket', 2],
  ['Return library books', '', 5],
  ['Pharmacy', 'Toothpaste\nPlasters\nVitamin D', 0],
  ['Quote', 'Make it work, then make it small.', 3],
  ['Try it', 'Tap a note to edit it. Hold to zoom. Swipe left to delete. The plus button adds a new one.', 2, 1],
  ['Running low', 'Salt\nOlive oil\nTea', 0]
];
const OLD = ['Weekend shop', 'Taco night', 'Breakfast', 'Sauna evening', 'Baking', 'Soup', 'Pharmacy', 'Party', 'Pasta', 'Cat', 'Smoothies', 'Cleaning', 'Picnic', 'Curry', 'Running low'];
function addExamples() {
  const t = Date.now();
  notes = EX.map((e, i) => ({ id: t + i, title: e[0], body: e[1], color: COLORS[e[2]], star: !!e[3], ex: true })).concat(notes);
  store(); render();
}
let seeded = false, inv = false;
try { seeded = !!localStorage.getItem(KEY + '-seeded2'); inv = !!localStorage.getItem(KEY + '-inv'); } catch (e) {}
if (!seeded) {
  notes = notes.filter(n => !n.ex && !OLD.includes(n.title));
  addExamples(); try { localStorage.setItem(KEY + '-seeded2', '1'); } catch (e) {}
}
function setInv(on) {
  inv = on; document.documentElement.toggleAttribute('data-inv', on);
  try { localStorage.setItem(KEY + '-inv', on ? '1' : ''); } catch (e) {}
}
setInv(inv);
function closeMenu() { $('menu').hidden = true; $('mClear').textContent = 'Clear all notes'; delete $('mClear').dataset.armed; }
function closeAll() { closePop(); closeMenu(); }
$('invBtn').onclick = $('mInv').onclick = () => setInv(!inv);
$('gear').onclick = () => { const open = $('menu').hidden; closeAll(); if (open) { $('mUndo').disabled = !undo;
  const u = undo && undo[0][1];
  $('undoHint').textContent = !undo ? 'Nothing to undo' : undo.length > 1 ? undo.length + ' notes' : (u.title || (u.body || '').split('\n')[0] || 'Note');
  $('menu').hidden = false; $('veil').hidden = false; } };
$('mUndo').onclick = () => { undoDelete(); closeAll(); };
$('mEx').onclick = () => { addExamples(); closeAll(); };
$('mClear').onclick = () => {
  if (!$('mClear').dataset.armed) { $('mClear').dataset.armed = '1'; $('mClear').textContent = 'Tap again to clear'; return; }
  removeNotes(notes.slice()); closeAll();
};
$('plus').onclick = () => { closeMenu(); $('pop').classList.contains('open') ? closePop() : openPop(); };
$('veil').onclick = closeAll;
$('exitBtn').onclick = () => {
  closeAll(); $('openBtn').classList.remove('go');
  $('main').classList.add('off'); $('start').classList.remove('off');
  $('plus').hidden = true; $('gear').hidden = true; $('exitBtn').hidden = true;
};
$('saveBtn').onclick = save;
$('thanksBtn').onclick = () => { location.href = './'; };
$('starBtn').onclick = () => setStar(!star);
$('delBtn').onclick = del;
$('colorBtn').onclick = () => { $('colors').hidden = !$('colors').hidden; };
document.addEventListener('keydown', e => {
  if (!$('pop').classList.contains('open')) return;
  if (e.key === 'Escape') closePop();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) save();
});
render();
</script>

</body>
</html>
